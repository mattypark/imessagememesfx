name = "memefx"
main = "src/index.ts"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# MemeFX's own database — friends, rooms, device tokens. Create it once with:
#   wrangler d1 create memefx
# then paste the printed database_id here. The schema lives in schema.sql:
#   wrangler d1 execute memefx --file schema.sql
[[d1_databases]]
binding = "DB"
database_name = "memefx"
database_id = "224c6ce9-504a-494b-b427-ac30a6d42362"

# Secrets (never in this file — set with `wrangler secret put NAME`):
#   APNS_KEY_ID, APNS_TEAM_ID, APNS_KEY_P8   the Apple push key (.p8) and its ids
#   APNS_TOPIC = com.matthewpark.memefx

[vars]
APNS_TOPIC = "com.matthewpark.memefx"
